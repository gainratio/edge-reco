[project]
name = "edgereco"
version = "0.13.0"
description = "Search and product recommendations for small online stores, running in each shopper's browser instead of a paid server."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fix
  "polars>=1.0",
  "faiss-cpu>=1.9",
  "sentence-transformers>=5.5",
  "rank-bm25>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "typer>=0.15",
  "httpx>=0.27",
  "numpy>=2.0",
  "structlog>=24.4",
  # FROM PyPI, NOT GIT. edge-proc has been on PyPI since 2026-07-22 (0.1.5) and
  # 0.2.0 shipped 2026-08-01, so the `[tool.uv.sources]` git pin on d88af07 — a rev
  # from the 0.1.5 line — is gone. Its stated reason ("pending its own PyPI release")
  # had been false for twelve days. That pin cost real coverage: pip-audit SKIPS any
  # URL requirement ("URL requirements cannot be pinned to a specific package
  # version"), so a CVE against edge-proc or its transitive deps was invisible to
  # `poe audit` while it stood. With a normal version requirement, edge-proc is
  # audited. It was the last URL requirement in this tree.
  #
  # The pin's other stated reason is also retired, not merely stale: uv honors a GIT
  # dependency's own `[tool.uv.sources]`, which is why the rev had to be one whose
  # edgeproc-core came from PyPI. A wheel carries no `[tool.uv.sources]` at all —
  # only `requires_dist` (edge-proc 0.5.0 declares `edgeproc-core>=0.4.3`) — so
  # consuming the release dissolves the lineage constraint rather than working
  # around it.
  #
  # Floor only, no ceiling — the same rule as avow below. 0.2.0 is 22 commits AHEAD
  # of the rev this replaces, including fail-closed anti-rollback/anti-replay at
  # promote and fail-closed FAISS index options; the pin was holding those back.
  #
  # 0.5.0 floor (was 0.2.0). 0.3.0 closed a HIGH anti-replay hole: an EQUAL version
  # read as "fresh", so a genuinely signed older pointer at the same label replayed
  # onto a device; a promote now needs a strictly greater `sequence` (every edgereco
  # publish already signs one — see catalog/publish.py). 0.4.0 made the embedding
  # model fail closed: `TextEncoder` refuses to fetch unless EDGEPROC_MODEL_PATH is
  # set or EDGEPROC_ALLOW_MODEL_DOWNLOAD=1 (see embeddings/encoder.py). 0.4.1 made
  # saved FAISS snapshots crash-atomic. 0.5.0 adds the keyring trust root the
  # browser tier already speaks, and raises its own core floor to 0.4.3.
  "edge-proc[localvec,bundles]>=0.5.0",
  # Direct dependency (not just transitive via edge-proc): edgereco imports
  # edgeproc_core.vector_mgmt.core.types in embeddings/index.py, so the
  # import is declared honestly here. Published on PyPI. 0.4.3 is the floor edge-proc
  # 0.5.0 itself requires (wire-safe RFC 9457 problem details); declared here too so
  # this direct import never resolves below what the substrate was tested against.
  "edgeproc-core>=0.4.3",
  # Assay owns deterministic score composition. Pin the independently verified
  # 0.5 release candidate exactly so every deployment executes the same formula.
  # The metrics extra retains the reference ranking metrics used by the relevance
  # baseline; the additive face now also drives every live score.
  "assay-engine[metrics]==0.5.0.dev3",
  # Avow owns only the RFC-8785 + Ed25519 evidence envelope. EdgeReco signs one
  # static ranking proof at catalog publish time and never signs shopper results.
  # 0.4.1 floor: the latest PyPI release. EdgeReco uses only content_hash /
  # load_signing_key / sign_payload, which are unchanged since 0.3.0; 0.4.x's
  # changes are ledger durability fixes (0.4.1 supersedes 0.4.0) plus the removal
  # of the deprecated `avow.replay_mismatch` code, which nothing here matches on.
  "avow>=0.4.1",
  # Direct: catalog/publish.py holds a FileLock on ORIGIN_DIR/.publish.lock from the
  # served-`latest` read through the `latest` write. Same floor as edge-proc's own.
  "filelock>=3.20",
  # Security floors on transitive deps (pulled via fastapi / edge-proc[bundles] /
  # sentence-transformers); pinned to the CVE-fixed releases. NO suppression — bump
  # where a fix exists. See `poe audit`.
  "anyio>=4.14.2",         # CVE-2026-63374 + CVE-2026-64847 (transitive via fastapi/httpx)
  "starlette>=1.3.1",       # CVE-2026-54283 + CVE-2026-54282 (transitive via fastapi)
  # cryptography arrives via edge-proc[bundles], whose own floor is only
  # `cryptography>=44` — so THIS line is the only thing holding the resolved version
  # up. Three advisories bear on it, and they do not share a fix version:
  #
  #   GHSA-537c-gmf6-5ccf   HIGH      vulnerable OpenSSL in the wheels   fixed 48.0.1
  #   GHSA-jwv3-5hgf-82ww   HIGH      CVE-2026-69249, duplicate self-signed
  #                                   intermediates -> exponential path building
  #                                                                      fixed 49.0.0
  #   GHSA-m2h6-j472-rp4c   MODERATE  CVE-2026-69248, wildcard DNS name escapes
  #                                   an intermediate's permittedSubtrees fixed 49.0.0
  #   GHSA-g6cj-pr64-35w5   HIGH      CVE-2026-69247, PKCS#7 EnvelopedData decryption
  #                                   is a Bleichenbacher oracle via distinguishable
  #                                   errors + timing (affects >=44.0.0) fixed 50.0.0
  #
  # 50.0.0 is therefore the floor: 49.0.0 clears the first three and leaves
  # CVE-2026-69247 standing, which is exactly what `poe audit` reported.
  # GHSA-537c-gmf6-5ccf is kept on the record because it is why this pin exists at
  # all; it is subsumed by 50, not retired.
  #
  # NOT REACHED, STILL FLOORED. The only cryptography import in the whole first-party
  # chain is edgeproc/bundles/signing.py -> `asymmetric.ed25519`. Raw 32-byte ed25519
  # is neither PKCS#7 nor X.509 path building, and nothing in the tree calls
  # pkcs7_decrypt_* or PolicyBuilder/ServerVerifier, so today's exposure is
  # precautionary. That is an argument for calm, not for staying on 49: the gate
  # contracts on the resolved version, and "we don't call it yet" expires the moment
  # someone adds a certificate.
  #
  # FLOOR ONLY, NO CEILING — the same rule as edge-proc and avow above, and here it
  # is load-bearing rather than stylistic. Two of these three fixes shipped in a
  # major (50.0.0); a `<49`-style cap would have converted each into a blocked build
  # and left the pin sitting on a vulnerable release. A ceiling on a security floor
  # is how you get pinned to the CVE.
  "cryptography>=50",       # GHSA-g6cj-pr64-35w5 / -jwv3-5hgf-82ww / -m2h6-j472-rp4c
  "msgpack>=1.2.1",         # GHSA-6v7p-g79w-8964 (transitive)
  "torch>=2.12.1",          # CVE-2025-3000 fix (GHSA-rrmf-rvhw-rf47, PYSEC-2025-194); transitive via sentence-transformers
  "setuptools>=83.0.0",     # PYSEC-2026-3447 (transitive build/runtime dep)
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.1",
  "pytest-bdd>=8.1",
  "mypy>=2.1",
  "ruff>=0.6",
  "poethepoet>=0.30",
  "pip-audit>=2.7",
  "xenon>=0.9",
]

[tool.uv]
package = true

[tool.uv.sources]
# EMPTY ON PURPOSE, and that is the point: every dependency now resolves from PyPI
# by version, and uv.lock pins the exact release + hashes. Open-source onboarding is
# clone ONLY this repo and `uv sync`. No URL requirements remain, so `poe audit`
# audits the whole tree — pip-audit silently skips anything it cannot pin to a
# version, so a git source is a hole in the scan, not just a resolution style.
#
# Adding an entry back is a real decision. It should be temporary (a fix that has
# not been released yet), it costs the audit coverage of that package and everything
# under it, and it must be removed the moment the release lands. See the edge-proc
# and avow notes in [project].dependencies for how the last two came out.
#
# Co-developing the substrate locally? Clone the siblings next to this repo and
# swap in path sources (uncomment):
#   edge-proc = { path = "../../edge-proc" }
#   edgeproc-core = { path = "../../edgeproc-core" }

[project.scripts]
edgereco = "edgereco.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
bdd_features_base_dir = "features/"
markers = [
  "bdd: BDD acceptance tests",
  "integration: integration tests",
  "e2e: end-to-end tests",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
# Ban explicit `Any` in annotations and flag now-dead branches. `strict` alone does
# not reject `dict[str, Any]`; these two close that gap so the type system can't be
# silently defeated. ruff's ANN401 enforces the SAME ban across tests too (see below),
# where mypy does not reach (`typecheck = mypy src`).
disallow_any_explicit = true
warn_unreachable = true
packages = ["edgereco"]
# Source roots for mypy. In the default flow both substrate deps install into
# site-packages from PyPI (`uv sync`), so mypy resolves them there; the sibling
# entries only serve the optional co-developer path-source flow (see
# [tool.uv.sources]). Both siblings use a flat layout (package dir at repo root).
mypy_path = [
  "src",
  "../../edge-proc",
  "../../edgeproc-core",
]

# Pydantic v2 injects `__pydantic_extra__` / `__pydantic_private__: dict[str, Any]`
# into EVERY model, so `disallow_any_explicit` fires on each BaseModel/BaseSettings
# subclass — an unavoidable false positive in an all-Pydantic codebase, not author
# `Any`. Exempt exactly the model-defining modules from THAT one check (there is no
# author-written `Any` in them — verified). ruff's ANN401 still bans literal `Any` in
# these same files, so a real `dict[str, Any]` field here is still rejected.
[[tool.mypy.overrides]]
module = [
  "edgereco.api.models",
  "edgereco.api.routes.events",
  "edgereco.catalog.models",
  "edgereco.catalog.publish",
  "edgereco.catalog.synthetic",
  "edgereco.config",
  "edgereco.reco.audit",
  "edgereco.reco.cooccurrence",
  "edgereco.reco.ranking_config",
  "edgereco.reco.score_receipt",
  "edgereco.reco.relevance_baseline",
  "edgereco.reco.retrain",
  "edgereco.republish",
]
disallow_any_explicit = false

# The substrate siblings are pinned external deps (GitHub tags), not edge-reco code:
# the no-`Any` ban is ours to enforce on `edgereco.*`, not on vendored source we don't
# own (and which is also all-Pydantic). Exempt them so `mypy src` still follows their
# imports normally.
[[tool.mypy.overrides]]
module = ["edgeproc.*", "edgeproc_core.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["faiss"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = ["../.deps", "demo_server"]  # sibling checkouts only present in CI; demo_server is an optional example launcher

[tool.ruff.lint]
# ANN401 bans explicit `Any` in annotations repo-wide (src AND tests). mypy only
# typechecks src, so ANN401 is the lightest way to extend the no-`Any` ban onto
# test code without dragging in the rest of the ANN (missing-annotation) suite.
select = ["E", "F", "W", "I", "B", "SIM", "UP", "N", "S", "A", "C4", "PT", "RUF", "ANN401"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.isort]
# `scripts/` is repo code, not a dependency: it sits beside src/ rather than under
# it, so isort's src-path heuristic would otherwise file `from scripts.… import …`
# (tests/unit/test_compare_parity_fixtures.py) under third-party.
known-first-party = ["scripts"]

[tool.coverage.run]
source = ["edgereco"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.poe.tasks]
fmt-check = "ruff format --check ."
lint = "ruff check ."
# `src` plus scripts/compare_parity_fixtures.py — that script is a CI GATE component
# (both parity workflows fail the build on its exit code), so it is held to the same
# bar as shipped source. The remaining scripts/ files are one-shot generators that do
# not yet clear it; they are named individually as they are cleaned up rather than
# exempted wholesale.
typecheck = "mypy src scripts/compare_parity_fixtures.py"
# Complexity gate: A/A/A per house standard §2 — every block, module, and the
# average must hold Radon rank A.
complexity = "xenon --max-absolute A --max-modules A --max-average A src scripts/compare_parity_fixtures.py"
# Dependency vulnerability scan (network-dependent — hits the PyPI advisory DB).
# Runs as the Dagger `backend-audit` check, which goes honestly RED on any finding,
# so dependency advisories cannot be hidden by an unrelated quality failure.
# NO suppressions — every finding is fixed by a version floor, not
# silenced. See the security-floor pins in [project].dependencies above.
#
# CVE-2025-3000 (GHSA-rrmf-rvhw-rf47, PYSEC-2025-194), torch.jit.script memory
# corruption, is now FIXED by torch 2.12.1 (OSV last_affected 2.12.0). The earlier
# `--ignore-vuln CVE-2025-3000` suppression has been DROPPED in favour of the real
# fix — the `torch>=2.12.1` floor above. The audit runs clean with no ignore flags.
#
# Portable invocation (house standard §4): export the committed uv.lock to a
# requirements file and audit THAT — pip-audit's default venv mode audits whatever
# happens to be installed, which drifts from the lock. `--no-deps --disable-pip`
# keeps pip-audit from resolving or installing anything itself.
audit.shell = """
uv export --frozen --all-extras --no-emit-project --no-hashes -o .audit-requirements.txt \
  && pip-audit -r .audit-requirements.txt --disable-pip --no-deps \
  && rm .audit-requirements.txt
"""
test = "pytest --cov=edgereco --cov-report=term-missing --cov-fail-under=90"
fmt = "ruff format ."
# `gate` mirrors Dagger's quality steps (format-check + lint + typecheck + complexity +
# test-with-coverage). `pip-audit` runs in the separate Security audit workflow.
gate = ["fmt-check", "lint", "typecheck", "complexity", "test"]

# `demo` is the turnkey, backend-free showcase: it brings up the Caddy edge (signed
# bundle on :8081), starts the Vite SPA (:5174), and opens your browser. Reuses the
# same edge + Vite + trap-teardown sequence as frontend/Makefile:dev, plus a deps
# guard and Vite's `--open`. The demo runs entirely in-browser — no FastAPI here.
[tool.poe.tasks.demo]
help = "Turnkey backend-free demo — edge + Vite SPA on free ports, opens your browser."
cwd = "../frontend"            # poe resolves this relative to the project root (backend/)
# Thin wrapper over the single orchestrator (frontend/app/scripts/demo.mjs), which
# allocates random free ports per run and wires them through compose/Vite/CORS/the
# preflight. Kept in sync with poe_tasks.toml's [tasks.demo].
shell = "node app/scripts/demo.mjs"

# Same demo, PLUS the flywheel uplink: interaction events are captured in-tab and
# periodically flushed to a mimicked-cloud collector (the FastAPI /events). Inference
# stays 100% local — the uplink is an optional, off-path beacon.
# Kept in sync with poe_tasks.toml's [tasks.demo-flywheel].
[tool.poe.tasks.demo-flywheel]
help = "Demo + flywheel uplink — events flush to a mimicked cloud collector (free port)."
cwd = "../frontend"
shell = "node app/scripts/demo.mjs --flywheel"

# The CLOUD half of the flywheel: recompute popularity from the collected events
# and republish a freshly signed bundle into the runtime origin. The edge
# revalidates `latest` within 30s, so a browser refresh re-ranks the rail toward
# what you clicked. The collector's randomly-chosen port is read from the
# demo-ports.env the flywheel run wrote. Kept in sync with poe_tasks.toml's
# [tasks.demo-retrain].
[tool.poe.tasks.demo-retrain]
help = "Flywheel retrain — recompute popularity from collected events, republish the signed bundle."
shell = """
set -e
ORIGIN=../frontend/.demo-origin
[ -d "$ORIGIN/manifest" ] || { echo 'No runtime origin yet — run `poe demo-flywheel` first, click around, then retrain.'; exit 1; }
[ -f examples/keys/private.key ] || { echo 'Missing examples/keys/private.key (gitignored). Retrain re-signs the bundle, so the maintainer signing key is required.'; exit 1; }
# The flywheel run records its randomly-chosen collector port here; fall back to 8000.
COLLECTOR_PORT=8000
[ -f "$ORIGIN/demo-ports.env" ] && . "$ORIGIN/demo-ports.env"
echo ">> retrain -> syncing the current bundle, folding in collected engagement, republishing… (collector :$COLLECTOR_PORT)"
uv run edgereco retrain "$ORIGIN" "$ORIGIN" examples/keys/private.key examples/keys/public.key --events-url "http://localhost:${COLLECTOR_PORT}/events/export" --alpha 0.5 --cache-dir .retrain-cache
echo '>> done. Refresh the SPA tab — the rail re-ranks toward what you clicked.'
"""
