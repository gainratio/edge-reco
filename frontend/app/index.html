    <noscript>
      <h1>EdgeReco: search and recommendations on the shopper's device</h1>
      <p>
        EdgeReco is an open-source product search and recommendation engine that
        runs in the shopper's browser. A store publishes one signed catalog
        bundle; the browser verifies it, stores it locally, and serves search,
        ranking, and personalized recommendations without a per-query backend.
      </p>
      <h2>How it works</h2>
      <p>
        The catalog is content-addressed and signed with Ed25519. EdgeReco checks
        the signature and every SHA-256 chunk before using the data. It then runs
        BM25 keyword search and vector search on-device, combines their results
        with Reciprocal Rank Fusion, and reranks products using only signals from
        the current browser session.
      </p>
      <h2>What the demo proves</h2>
      <p>
        Nimbus is the live example storefront. It downloads the same static
        bundle any CDN can host, performs retrieval and ranking locally, and can
        reload offline after the required assets are cached. Product interactions
        never leave the device: they are stored only in the browser's own SQLite
        database.
      </p>
