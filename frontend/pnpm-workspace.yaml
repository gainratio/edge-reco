packages:
  - app
  - packages/*

minimumReleaseAge: 0

# Security dependency overrides. pnpm v10+ reads `overrides` from here, not from
# the package.json `pnpm` field (which v11 ignores). undici >=7.28.0 clears 6
# Dependabot alerts (test-only, via jsdom); protobufjs >=7.6.5 clears 1 alert
# (RUNTIME, pulled by the transformers.js embedder via onnxruntime-web).
#
# Both are pinned to their current major (<8) — a minimal security bump, not a
# major upgrade:
#   adm-zip: pin the onnxruntime-node transitive dependency to 0.6.1, which fixes
#     GHSA-vwc7-r8mq-g2x9 (archive extraction follows destination symlinks and can
#     overwrite arbitrary files). 0.6.1 is the first patched release and stays on
#     the same 0.6 line used by the existing override.
#   undici: jsdom@29.1.1 hard-requires undici's internal
#     `lib/handler/wrap-handler.js`, which undici 8.x removed — an open `>=7.28.0`
#     resolves to 8.x and breaks the jsdom test env. 7.28.0 (latest 7.x) clears all 6.
#   protobufjs: floor raised 7.6.3 -> 7.6.5 for GHSA-j3f2-48v5-ccww (DoS via
#     infinite loop in .proto option parsing; vulnerable >=7.5.0 <=7.6.4, patched
#     >=7.6.5). The old `>=7.6.3` floor still admitted the vulnerable 7.6.4, which
#     is what the lockfile had resolved. Keep the `<8` bound: onnxruntime-web
#     declares `protobufjs: ^7.2.4`, so an open `>=7.6.5` overshoots to 8.x — a
#     needless runtime major bump that also breaks the engine's declared range,
#     and 8.x carries its own live advisories (GHSA-jfj6-75fj-8934, and j3f2
#     again through <=8.6.5). 7.6.5 is the patched 7.x line (npm `latest-7`).
#   sharp: pin transitive sharp to the patched 0.35.x line. `app/package.json`
#     already declares a direct `sharp: ^0.35.4` devDependency, but that does NOT
#     force the NESTED copy pnpm resolves under `@huggingface/transformers`
#     (declared `sharp: ^0.34.5`, capped below 0.35) — pnpm audit still flagged
#     that path (app>@huggingface/transformers>sharp) with libvips CVEs. The floor
#     is now 0.35.4 for GHSA-rgj7-g3m4-5g8c (libheif vulnerabilities; patched in
#     0.35.4). An explicit override is the only way to force that nested resolution
#     onto the patched line too. Bounded below 0.36 to avoid an unrelated upgrade.
#   fast-uri: floor raised to >=3.1.6 for GHSA-5jgf-p345-68v8,
#     GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, and GHSA-jqff-g426-hqxp (host
#     confusion and SSRF variants; patched in 3.1.6). This supersedes the earlier
#     >=3.1.5 floor for GHSA-7p8r-x3mc-p8w7 / CVE-2026-18446, which superseded
#     the earlier >=3.1.4 floor set for
#     GHSA-v2hh-gcrm-f6hx — same class of defect, and 3.1.4 turned out to still
#     admit it, which is why the floor moves rather than the advisory being
#     re-cited. Pulled in transitively via vite-plugin-pwa>workbox-build>
#     @apideck/better-ajv-errors>ajv>fast-uri; no direct dependency exists to bump
#     instead. Bounded `<4` — a minimal security bump within the patched 3.x line,
#     not an unrelated major upgrade.
#   postcss: floor raised to >=8.5.18 for GHSA-r28c-9q8g-f849 (path traversal in
#     previous-source-map auto-loading via `sourceMappingURL`, leaking arbitrary
#     .map files; vulnerable <=8.5.17, patched >=8.5.18). Pulled in transitively
#     only through vite (app>vite>postcss and the vitest/@vitejs/plugin-react
#     copies of the same vite), which declares `postcss: ^8.5.x` — so there is no
#     direct dependency to bump instead. Bounded `<9` — a floor inside the
#     patched 8.x line, not a major upgrade.
#   brace-expansion: floor raised to >=5.0.9. Two advisories stack on this package
#     and only 5.0.9 clears both:
#       GHSA-mh99-v99m-4gvg (DoS — unbounded expansion length crashes the process
#         with OOM; vulnerable <=5.0.7, patched >=5.0.8). ONE vulnerable range
#         spanning every major and ONE fix — upstream shipped no 1.x/2.x/3.x/4.x
#         backport, so every resolution must land on the 5.x line.
#       GHSA-rgw5-rvv9-x895 (DoS — unbounded INTERMEDIATE arrays; the expansion
#         is built up in memory before the length check that GHSA-mh99 added ever
#         runs, so 5.0.8 bypasses its own CVE-2026-14257 mitigation. Vulnerable
#         >=4.0.0 <5.0.9, patched >=5.0.9). This is why the 5.0.8 floor below went
#         red on main: 5.0.8 fixed the first advisory and is vulnerable to the
#         second. Note the range starts at 4.0.0 — 1.x/2.x/3.x are unaffected by
#         this one, but they are still caught by GHSA-mh99 above, so dropping to
#         an older major is not an escape. 5.0.9 is the only version clear of both.
#     `filelist` below is what makes a single 5.x resolution possible; see the
#     note there.
#   filelist: floor raised to >=2.0.2 — required to make the brace-expansion floor
#     above *viable*, not an independent upgrade. Two paths resolved a vulnerable
#     brace-expansion:
#       app>vite-plugin-pwa>workbox-build>glob>minimatch@10.2.5>brace-expansion 5.0.7
#       …>ejs>jake>filelist@1.0.6>minimatch@5.1.9>brace-expansion 2.1.2
#     The first bumps cleanly (minimatch 10.2.5 declares `^5.0.5`). The second does
#     NOT: minimatch@5.1.9 declares `brace-expansion: ^2.0.1` and consumes it as a
#     callable CJS default (`expand(pattern)`), while 5.x exports named bindings
#     (`exports.expand`, `__esModule: true`). Forcing 5.0.8 there throws
#     `TypeError: expand is not a function` at minimatch.js:119 — verified locally.
#     Upstream already solved this: filelist@2.0.2 depends on `minimatch: ^10.2.1`,
#     which is on the brace-expansion 5.x line. Raising filelist drops minimatch@5.1.9
#     from the graph entirely, leaving one brace-expansion (now 5.0.9) that every
#     consumer can actually use — minimatch@10.2.6 declares `^5.0.5`, which 5.0.9
#     satisfies. filelist 2.x is still CJS (`main: index.js`) so jake@10.9.4's
#     `require('filelist')` is unaffected; jake itself moved to `filelist: ^2.0.2` in
#     jake@12, confirming the API is compatible. Bounded `<3`.
#   nanoid: floor raised to >=3.3.18 for GHSA-2v37-7h3g-55p8 / CVE-2026-67213
#     (HIGH — a custom alphabet generator loops forever when `size` is 0, hanging
#     the caller; npm's current advisory marks <3.3.18 vulnerable on the 3.x line.
#     Pulled in transitively only through postcss (app>vite>postcss>nanoid, plus
#     the vitest / @vitejs/plugin-react copies of the same vite) — 17 paths, one
#     resolution, and no direct dependency to bump instead. postcss@8.5.25 already
#     declares `nanoid: ^3.3.11`, so the range admits the fix; the lockfile had
#     simply frozen 3.3.16 from before it existed. The floor makes the patched
#     version a stated requirement rather than a side effect of when the lock was
#     last resolved.
#     This is NOT a defect introduced by any open PR: 3.3.16 is byte-identical on
#     main and on every open branch. The advisory was published 2026-07-29 and
#     changed after the previous green audit, which is why the floor moved again.
#     Bounded `<4` for the usual minimal-bump reason and one hard one: nanoid 4.x+
#     is ESM-only (it dropped the CJS entry point), while postcss is CJS and does
#     `require('nanoid')`. An open `>=3.3.18` overshoots to the 6.x line and breaks
#     postcss outright. 3.x is the patched line postcss can actually consume.
#   serialize-javascript: floor >=7.1.2 for GHSA-gfhx-hw2g-v5hg (LOW - XSS via an
#     unescaped </script> in serialized function bodies; 7.1.1 only). Build-time
#     only: app>vite-plugin-pwa>workbox-build>@rollup/plugin-terser. Every direct
#     and intermediate dependency is already on its latest release, and
#     @rollup/plugin-terser@1.0.0 declares `^7.0.3`, so no upstream bump exists to
#     take; the lock had frozen 7.1.1 from before 7.1.2 shipped (2026-09-23). A
#     plain `pnpm update` also drags unrelated rollup patch bumps, so the floor is
#     the minimal change. Bounded `<8` to stay on the major terser consumes.
overrides:
  adm-zip: "0.6.1"
  undici: ">=7.28.0 <8"
  protobufjs: ">=7.6.5 <8"
  sharp: ">=0.35.4 <0.36"
  fast-uri: ">=3.1.6 <4"
  postcss: ">=8.5.18 <9"
  brace-expansion: ">=5.0.9 <6"
  filelist: ">=2.0.2 <3"
  nanoid: ">=3.3.18 <4"
  serialize-javascript: ">=7.1.2 <8"

# pnpm v11 does not run a dependency's build/postinstall scripts unless it is
# explicitly allowlisted here (replaces v10's onlyBuiltDependencies). These are
# transitive native deps of @huggingface/transformers, needed by the node-side
# embedding parity tests: onnxruntime-node is the native ONNX backend, protobufjs
# compiles its proto bindings, sharp builds its native image binary.
allowBuilds:
  "@edgeproc/browser": true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true
